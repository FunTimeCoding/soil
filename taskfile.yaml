---
version: '3'
tasks:
  default: {cmds: [{task: lint}, {task: test}, {task: build}], silent: true}
  pre-push: {cmds: [{task: lint}, {task: test}], silent: true}
  lint:
    desc: 'golangci-lint, then gocheck - golint, goaudit, gofix and goanalyze in one run - applying what they fix'
    cmds:
    - |
      status=0
      golangci-lint run --build-tags "$(goreach --tags)" || status=1
      gocheck --fix || status=1
      exit $status
    silent: true
  lint-check:
    desc: 'task lint without writing; REACH=own or REACH=<session> narrows it to what a session changed'
    cmds:
    - |
      status=0
      packages=./...
      if [ -n "{{.REACH}}" ]; then
        session={{if ne .REACH "own"}}{{.REACH}}{{end}}
        packages=$(goreach $session 2>/dev/null)
      fi
      if [ -n "$packages" ]; then
        golangci-lint run --build-tags "$(goreach --tags)" $packages || status=1
      fi
      gocheck {{if .REACH}}--reach {{.REACH}}{{end}} || status=1
      exit $status
    silent: true
  test:
    cmds: ['gotestsum --format dots -- --tags local ./...']
    silent: true
  check:
    cmds:
    - gosec -fmt=json -out=tmp/gosec.json -stdout -verbose=text -no-fail ./...
    silent: true
  generate:
