---
openapi: "3.0.0"
info:
  title: goalertlogd
  version: 1.0.0
paths:
  /api/alerts:
    get:
      operationId: getAlerts
      parameters:
      - name: name
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Alerts matching the given name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlertsResponse"
        "500":
          description: Failed to query alerts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/alerts/after:
    get:
      operationId: getAlertsAfter
      description: Records with an identifier above the given one, ascending - a cursor walk for consumers.
      parameters:
      - name: identifier
        in: query
        required: true
        schema:
          type: integer
          minimum: 0
      - name: limit
        in: query
        required: false
        description: Records per page; 5 when omitted, at most 25.
        schema:
          type: integer
          minimum: 1
      responses:
        "200":
          description: The next records after the identifier.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlertsResponse"
        "500":
          description: Failed to query alerts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/alerts/by-identifier:
    get:
      operationId: getAlertsByIdentifier
      description: Records by identifier, ascending; unknown or pruned identifiers are absent from the result.
      parameters:
      - name: identifier
        in: query
        required: true
        description: Repeatable; at most 25 are read.
        schema:
          type: array
          items:
            type: integer
      responses:
        "200":
          description: The records that exist.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlertsResponse"
        "500":
          description: Failed to query alerts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/alerts/recent:
    get:
      operationId: getRecentAlerts
      parameters:
      - name: start
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: end
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: Alerts within the given time range.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlertsResponse"
        "500":
          description: Failed to query alerts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/alerts/top:
    get:
      operationId: getTopAlerts
      parameters:
      - name: "n"
        in: query
        required: false
        schema:
          type: integer
      - name: start
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: end
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: Top alerts by occurrence count.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopAlertsResponse"
        "500":
          description: Failed to query alerts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/status:
    get:
      operationId: getStatus
      responses:
        "200":
          description: Service status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "500":
          description: Failed to query status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    AlertsResponse:
      type: object
      required:
      - identifier
      - fingerprint
      - name
      - severity
      - summary
      - labels
      - start
      - status
      properties:
        identifier:
          type: integer
        fingerprint:
          type: string
        name:
          type: string
        severity:
          type: string
        summary:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        start:
          type: string
        end:
          type: string
        status:
          type: string
          enum:
          - firing
          - resolved
    TopAlertsResponse:
      type: object
      required:
      - name
      - count
      - averageDuration
      - currentlyFiring
      - severity
      properties:
        name:
          type: string
        count:
          type: integer
        averageDuration:
          type: string
        currentlyFiring:
          type: integer
        severity:
          type: string
    StatusResponse:
      type: object
      required:
      - totalRecords
      - latestIdentifier
      properties:
        totalRecords:
          type: integer
        latestIdentifier:
          description: The newest record's identifier, 0 when there are none - where a new consumer starts its cursor.
          type: integer
        lastPoll:
          type: string
    ErrorResponse:
      type: object
      required: [error, event_identifier]
      properties:
        error:
          type: string
        event_identifier:
          type: string
