---
openapi: "3.0.0"
info:
  title: goatlassiand
  version: 1.0.0
paths:
  /api/v1/jira/search:
    get:
      operationId: searchIssues
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
        description: JQL query string.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Maximum number of results. Omit for all.
      responses:
        "200":
          description: Issues matching the JQL query.
          content:
            application/json:
              schema:
                type: array
                items:
                  nullable: true
                  allOf:
                  - $ref: "#/components/schemas/JiraIssue"
        "500":
          description: Failed to search issues.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/jira/issue/{key}:
    get:
      operationId: getIssue
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: Issue key (e.g. PROJ-123).
      - name: comments
        in: query
        required: false
        schema:
          type: boolean
        description: Include the issue's comments.
      responses:
        "200":
          description: Issue detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JiraIssue"
        "404":
          description: Issue not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to get issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/jira/issue/{key}/transitions:
    get:
      operationId: getTransitions
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: Issue key.
      responses:
        "200":
          description: Available transitions for the issue.
          content:
            application/json:
              schema:
                type: array
                items:
                  nullable: true
                  allOf:
                  - $ref: "#/components/schemas/JiraTransition"
        "500":
          description: Failed to get transitions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/jira/issue/{key}/transition:
    post:
      operationId: transitionIssue
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: Issue key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionRequest"
      responses:
        "204":
          description: Transition applied.
        "500":
          description: Failed to transition issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/jira/issue/{key}/comment:
    post:
      operationId: addIssueComment
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: Issue key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentRequest"
      responses:
        "204":
          description: Comment added.
        "500":
          description: Failed to add comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/jira/projects:
    get:
      operationId: listProjects
      responses:
        "200":
          description: All visible projects.
          content:
            application/json:
              schema:
                type: array
                items:
                  nullable: true
                  allOf:
                  - $ref: "#/components/schemas/JiraProject"
        "500":
          description: Failed to list projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/jira/issue:
    post:
      operationId: createIssue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIssueRequest"
      responses:
        "201":
          description: Created issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JiraIssue"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to create issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/jira/issue/{key}/update:
    post:
      operationId: updateIssue
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: Issue key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIssueRequest"
      responses:
        "200":
          description: Update result with field changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueUpdateResult"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to update issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/jira/meta:
    get:
      operationId: getCreateMeta
      parameters:
      - name: project
        in: query
        required: true
        schema:
          type: string
        description: Project key.
      - name: issue_type
        in: query
        required: true
        schema:
          type: string
        description: Issue type name.
      - name: expand
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated field names to expand allowed values.
      responses:
        "200":
          description: Create metadata fields.
          content:
            application/json:
              schema:
                type: array
                items:
                  nullable: true
                  allOf:
                  - $ref: "#/components/schemas/CreateMetaField"
        "500":
          description: Failed to get create metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/jira/users:
    get:
      operationId: searchUsers
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
        description: User search query.
      responses:
        "200":
          description: Matching users.
          content:
            application/json:
              schema:
                type: array
                items:
                  nullable: true
                  allOf:
                  - $ref: "#/components/schemas/JiraUser"
        "500":
          description: Failed to search users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/jira/issue/{key}/link:
    post:
      operationId: linkIssues
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: Outward issue key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkRequest"
      responses:
        "204":
          description: Issues linked.
        "500":
          description: Failed to link issues.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/jira/link/{identifier}:
    delete:
      operationId: deleteLink
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
        description: Link identifier.
      responses:
        "204":
          description: Link deleted.
        "500":
          description: Failed to delete link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/jira/link-types:
    get:
      operationId: getLinkTypes
      responses:
        "200":
          description: Available issue link types.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LinkType"
        "500":
          description: Failed to get link types.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/jira/issue/{key}/comment/{identifier}:
    put:
      operationId: updateComment
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: Issue key.
      - name: identifier
        in: path
        required: true
        schema:
          type: string
        description: Comment identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentRequest"
      responses:
        "204":
          description: Comment updated.
        "500":
          description: Failed to update comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteComment
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: Issue key.
      - name: identifier
        in: path
        required: true
        schema:
          type: string
        description: Comment identifier.
      responses:
        "204":
          description: Comment deleted.
        "500":
          description: Failed to delete comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/jira/issue/{key}/checklist:
    get:
      operationId: getChecklist
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: Issue key.
      responses:
        "200":
          description: Checklist items.
          content:
            application/json:
              schema:
                type: array
                items:
                  nullable: true
                  allOf:
                  - $ref: "#/components/schemas/ChecklistItem"
        "500":
          description: Failed to read checklist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: addChecklistItem
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: Issue key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistTextRequest"
      responses:
        "200":
          description: Checklist after addition.
          content:
            application/json:
              schema:
                type: array
                items:
                  nullable: true
                  allOf:
                  - $ref: "#/components/schemas/ChecklistItem"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to add checklist item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/jira/issue/{key}/checklist/{index}:
    put:
      operationId: editChecklistItem
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: Issue key.
      - name: index
        in: path
        required: true
        schema:
          type: integer
        description: One-based item index.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistTextRequest"
      responses:
        "200":
          description: Checklist after edit.
          content:
            application/json:
              schema:
                type: array
                items:
                  nullable: true
                  allOf:
                  - $ref: "#/components/schemas/ChecklistItem"
        "400":
          description: Index out of range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to edit checklist item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteChecklistItem
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: Issue key.
      - name: index
        in: path
        required: true
        schema:
          type: integer
        description: One-based item index.
      responses:
        "200":
          description: Checklist after deletion.
          content:
            application/json:
              schema:
                type: array
                items:
                  nullable: true
                  allOf:
                  - $ref: "#/components/schemas/ChecklistItem"
        "400":
          description: Index out of range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to delete checklist item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/jira/issue/{key}/checklist/{index}/toggle:
    post:
      operationId: toggleChecklistItem
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: Issue key.
      - name: index
        in: path
        required: true
        schema:
          type: integer
        description: One-based item index.
      responses:
        "200":
          description: Checklist after toggle.
          content:
            application/json:
              schema:
                type: array
                items:
                  nullable: true
                  allOf:
                  - $ref: "#/components/schemas/ChecklistItem"
        "400":
          description: Index out of range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to toggle checklist item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/confluence/spaces:
    get:
      operationId: listSpaces
      responses:
        "200":
          description: All visible spaces.
          content:
            application/json:
              schema:
                type: array
                items:
                  nullable: true
                  allOf:
                  - $ref: "#/components/schemas/ConfluenceSpace"
        "500":
          description: Failed to list spaces.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/confluence/search:
    get:
      operationId: searchPages
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
        description: CQL query string or plain text.
      responses:
        "200":
          description: Pages matching the query.
          content:
            application/json:
              schema:
                type: array
                items:
                  nullable: true
                  allOf:
                  - $ref: "#/components/schemas/ConfluencePage"
        "500":
          description: Failed to search pages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/confluence/page:
    post:
      operationId: createPage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePageRequest"
      responses:
        "201":
          description: Created page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfluencePageDetail"
        "500":
          description: Failed to create page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/confluence/page/{identifier}:
    get:
      operationId: getPage
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
        description: Page ID.
      responses:
        "200":
          description: Page detail with body content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfluencePageDetail"
        "404":
          description: Page not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to get page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updatePage
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
        description: Page ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePageRequest"
      responses:
        "200":
          description: Updated page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfluencePageDetail"
        "404":
          description: Page not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to update page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePage
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
        description: Page ID.
      - name: draft
        in: query
        required: false
        schema:
          type: boolean
        description: Delete the draft instead of the published page.
      responses:
        "204":
          description: Page deleted.
        "500":
          description: Failed to delete page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/confluence/page/{identifier}/children:
    get:
      operationId: getPageChildren
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
        description: Parent page ID.
      responses:
        "200":
          description: Child pages.
          content:
            application/json:
              schema:
                type: array
                items:
                  nullable: true
                  allOf:
                  - $ref: "#/components/schemas/ConfluencePage"
        "500":
          description: Failed to get children.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/confluence/page/{identifier}/comment:
    post:
      operationId: addPageComment
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
        description: Page ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentRequest"
      responses:
        "204":
          description: Comment added.
        "500":
          description: Failed to add comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/confluence/page/{identifier}/draft:
    get:
      operationId: getPageDraft
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
        description: Page ID.
      responses:
        "200":
          description: Page with unpublished draft changes overlaid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfluencePageDetail"
        "500":
          description: Failed to get page draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/confluence/page/{identifier}/status:
    post:
      operationId: setPageStatus
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
        description: Page ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageStatusRequest"
      responses:
        "200":
          description: Page after status change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfluencePageDetail"
        "400":
          description: Invalid status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to set page status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/confluence/page/{identifier}/edit:
    post:
      operationId: editPage
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
        description: Page ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditPageRequest"
      responses:
        "200":
          description: Page after partial edit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfluencePageDetail"
        "400":
          description: Old text not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to edit page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/confluence/pages:
    get:
      operationId: listPages
      parameters:
      - name: space
        in: query
        required: true
        schema:
          type: string
        description: Space identifier.
      - name: status
        in: query
        required: false
        schema:
          type: string
        description: Page status filter.
      responses:
        "200":
          description: Pages in the space.
          content:
            application/json:
              schema:
                type: array
                items:
                  nullable: true
                  allOf:
                  - $ref: "#/components/schemas/ConfluencePage"
        "500":
          description: Failed to list pages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    JiraIssue:
      type: object
      required:
      - key
      - summary
      - status
      - type
      properties:
        key:
          type: string
        summary:
          type: string
        description:
          type: string
        status:
          type: string
        priority:
          type: string
        type:
          type: string
        assignee:
          type: string
        labels:
          type: array
          items:
            type: string
        created:
          type: string
        updated:
          type: string
        due:
          type: string
        link:
          type: string
        comments:
          # Only present when requested with the comments flag.
          type: array
          items:
            nullable: true
            allOf:
            - $ref: "#/components/schemas/JiraComment"
    JiraComment:
      type: object
      required:
      - identifier
      - author
      - body
      - created
      properties:
        identifier:
          type: string
        author:
          type: string
        body:
          type: string
        created:
          type: string
        updated:
          type: string
    JiraProject:
      type: object
      required:
      - key
      - name
      properties:
        key:
          type: string
        name:
          type: string
        type:
          type: string
        description:
          type: string
        link:
          type: string
    JiraTransition:
      type: object
      required:
      - identifier
      - name
      properties:
        identifier:
          type: string
        name:
          type: string
        toStatus:
          type: string
    ConfluenceSpace:
      type: object
      required:
      - identifier
      - key
      - name
      properties:
        identifier:
          type: string
        key:
          type: string
        name:
          type: string
        type:
          type: string
        description:
          type: string
        homepageIdentifier:
          type: string
    ConfluencePage:
      type: object
      required:
      - identifier
      - title
      properties:
        identifier:
          type: string
        title:
          type: string
        type:
          type: string
        status:
          type: string
        link:
          type: string
    ConfluencePageDetail:
      type: object
      required:
      - identifier
      - title
      properties:
        identifier:
          type: string
        title:
          type: string
        spaceIdentifier:
          type: string
        body:
          type: string
        link:
          type: string
    CreatePageRequest:
      type: object
      required:
      - spaceIdentifier
      - parentIdentifier
      - title
      - body
      properties:
        spaceIdentifier:
          type: string
          description: Space ID to create the page in.
        parentIdentifier:
          type: string
          description: Parent page ID.
        title:
          type: string
          description: Page title.
        body:
          type: string
          description: Page content in markdown.
    UpdatePageRequest:
      type: object
      required:
      - title
      - body
      properties:
        title:
          type: string
          description: Page title.
        body:
          type: string
          description: Page content in markdown.
        message:
          type: string
          description: Version comment.
    TransitionRequest:
      type: object
      required:
      - transitionIdentifier
      properties:
        transitionIdentifier:
          type: string
          description: Transition ID from get_transitions.
    CommentRequest:
      type: object
      required:
      - body
      properties:
        body:
          type: string
          description: Comment body text.
    CreateIssueRequest:
      type: object
      required: [project, issue_type, summary]
      properties:
