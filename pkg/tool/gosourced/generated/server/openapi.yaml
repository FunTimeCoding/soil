---
openapi: "3.0.0"
info:
  title: gosourced
  version: 1.0.0
paths:
  /api/diff:
    get:
      operationId: getDiff
      parameters:
      - name: module
        in: query
        required: true
        schema:
          type: string
      - name: from
        in: query
        required: false
        description: Revision to compare from, HEAD when empty.
        schema:
          type: string
      - name: to
        in: query
        required: false
        description: Revision to compare to, the staged index when empty.
        schema:
          type: string
      - name: text
        in: query
        required: false
        description: >-
          Include each changed symbol's text - a line diff of the declaration,
          the whole declaration when added, its first line when removed.
        schema:
          type: boolean
      responses:
        "200":
          description: Symbol diff between the two revisions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiffResponse"
        "404":
          description: Unknown module or revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The revisions could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/census:
    get:
      operationId: getCensus
      parameters:
      - name: module
        in: query
        required: true
        schema:
          type: string
      - name: package
        in: query
        required: true
        description: Full import path of the package declaring the type.
        schema:
          type: string
      - name: type
        in: query
        required: true
        description: The struct type whose methods are counted.
        schema:
          type: string
      responses:
        "200":
          description: >-
            Every method of the type - its callers by kind, what it calls,
            reads and uses, the tables its store calls read and write, and
            the same with what it calls.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Census"
        "400":
          description: Unknown package, or the type is not a struct.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown module.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The packages could not be loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/index/prune:
    post:
      operationId: postIndexPrune
      description: >-
        Delete every index generation but the daemon's own, and every build
        inside it untouched for a day.
      responses:
        "200":
          description: What was removed, by name, relative to the index.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PruneResponse"
        "500":
          description: The index could not be pruned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/check:
    post:
      operationId: postCheck
      description: >-
        Run every lint stage over a repository - golint, goaudit, gofix and
        goanalyze - one check at a time across the daemon.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckRequest"
      responses:
        "200":
          description: >-
            Each stage's findings, the fixes not applied, and the packages
            checked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResponse"
        "404":
          description: The root is no module of the inventory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Other checks held the daemon past the wait.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The check could not run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    CheckRequest:
      type: object
      required:
      - root
      properties:
        root:
          type: string
          description: Absolute directory of the repository to check.
        fix:
          type: boolean
          description: Apply what golint and gofix can fix.
        fresh:
          type: boolean
          description: Check every package again, ignoring the clean cache.
        transcript:
          type: string
          description: >-
            A session's transcript, whose changes scope the check; the whole
            repository when empty.
    CheckResponse:
      type: object
      required:
      - root
      - announcement
      - unchanged
      - sections
      - changes
      - checked
      - stale
      properties:
        root:
          type: string
        announcement:
          type: string
        unchanged:
          type: boolean
        sections:
          type: array
          items:
            $ref: "#/components/schemas/CheckSection"
        changes:
          type: array
          items:
            $ref: "#/components/schemas/CheckChange"
        checked:
          type: array
          items:
            type: string
        stale:
          type: string
          description: >-
            A lint source changed since the daemon started, relative to its
            module; empty when none has.
    CheckSection:
      type: object
      required:
      - header
      - entries
      - unchecked
      properties:
        header:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/CheckConcern"
        unchecked:
          type: array
          items:
            $ref: "#/components/schemas/CheckUnchecked"
    CheckConcern:
      type: object
      required:
      - key
      - text
      - path
      - type
      - line
      - line_text
      - fixed
      - planned
      properties:
        key:
          type: string
        text:
          type: string
        path:
          type: string
        type:
          type: string
        line:
          type: integer
        line_text:
          type: string
        fixed:
          type: boolean
        planned:
          type: boolean
    CheckUnchecked:
      type: object
      required:
      - path
      - line
      - span
      - reason
      properties:
        path:
          type: string
        line:
          type: integer
        span:
          type: string
        reason:
          type: string
    CheckChange:
      type: object
      required:
      - path
      - destination
      - original
      - current
      properties:
        path:
          type: string
        destination:
          type: string
        original:
          type: string
          format: byte
        current:
          type: string
          format: byte
    PruneResponse:
      type: object
      required:
      - removed
      properties:
        removed:
          type: array
          items:
            type: string
    Census:
      type: object
      required:
      - package
      - type
      - fields
      - methods
      - unloaded
      properties:
        package:
          type: string
        type:
          type: string
        fields:
          type: array
          items:
            type: string
        methods:
          type: array
          items:
            $ref: "#/components/schemas/CensusMethod"
        unloaded:
          type: array
          items:
            $ref: "#/components/schemas/CensusUnloaded"
    CensusUnloaded:
      type: object
      required:
      - package
      - cause
      - lost
      properties:
        package:
          type: string
        cause:
          type: string
        lost:
          type: string
    CensusMethod:
      type: object
      required:
      - name
      - file
      - callers
      - calls
      - functions
      - fields
      - uses
      - packages
      - atomically
      - transaction_step
      - tables
      - reach
      properties:
        name:
          type: string
        file:
          type: string
        callers:
          type: array
          items:
            $ref: "#/components/schemas/CensusCaller"
        calls:
          description: Methods of the type it calls, through free functions too.
          type: array
          items:
            type: string
        functions:
          description: Free functions of the package it reaches.
          type: array
          items:
            type: string
        fields:
          description: Receiver fields it reads.
          type: array
          items:
            type: string
        uses:
          description: Methods it calls on the module's other types, by type.
          type: array
          items:
            $ref: "#/components/schemas/CensusUse"
        packages:
          description: The module's other packages it references.
          type: array
          items:
            type: string
        atomically:
          description: It opens a transaction through the store's Atomically.
          type: boolean
        transaction_step:
          description: It takes the transaction store as a parameter.
          type: boolean
        tables:
          $ref: "#/components/schemas/CensusTables"
        reach:
          description: The tables with every method it calls, transitively.
          allOf:
          - $ref: "#/components/schemas/CensusTables"
    CensusCaller:
      type: object
      required:
      - kind
      - package
      - function
      - count
      properties:
        kind:
          description: production, support, test or internal.
          type: string
        package:
          type: string
        function:
          type: string
        count:
          type: integer
    CensusUse:
      type: object
      required:
      - type
      - methods
      properties:
        type:
          type: string
        methods:
          type: array
          items:
            type: string
    CensusTables:
      type: object
      required:
      - read
      - written
      properties:
        read:
          type: array
          items:
            type: string
        written:
          type: array
          items:
            type: string
    DiffResponse:
      type: object
      required:
      - counts
      - entries
      - from_unparsed
      - to_unparsed
      - modules
      properties:
        modules:
          description: >-
            Required modules from the inventory that changed version between
            the two revisions and were compared with it.
          type: array
          items:
            $ref: "#/components/schemas/ModuleRange"
        counts:
          type: array
          items:
            $ref: "#/components/schemas/ClassCount"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/Entry"
        from_unparsed:
          type: array
          items:
            type: string
        to_unparsed:
          type: array
          items:
            type: string
    ModuleRange:
      type: object
      required:
      - name
      - from
      - to
      properties:
        name:
          type: string
        from:
          type: string
        to:
          type: string
          description: The staged index when empty.
    ClassCount:
      type: object
      required:
      - class
      - count
      properties:
        class:
          type: string
        count:
          type: integer
    Entry:
      type: object
      required:
      - class
      properties:
        class:
          type: string
        from:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/Location"
        to:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/Location"
        text:
          type: array
          items:
            type: string
    Location:
      type: object
      required:
      - key
      - file
      - line
      properties:
        key:
          type: string
        file:
          type: string
        line:
          type: integer
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
    ErrorResponse:
      type: object
      required:
      - error
      - event_identifier
      properties:
        error:
          type: string
        event_identifier:
          type: string
