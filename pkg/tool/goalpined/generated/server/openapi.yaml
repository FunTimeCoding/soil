---
openapi: "3.0.0"
info:
  title: goalpined
  version: 1.0.0
paths:
  /api/packages:
    get:
      operationId: getPackages
      parameters:
      - name: name
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Repository index listings, optionally filtered by package name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"
        "500":
          description: Failed to read the repository index.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/packages/{version}/{repository}/{architecture}/{file}:
    post:
      operationId: postPackage
      parameters:
      - name: version
        in: path
        required: true
        schema:
          type: string
      - name: repository
        in: path
        required: true
        schema:
          type: string
      - name: architecture
        in: path
        required: true
        schema:
          type: string
      - name: file
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The package was stored, signed and indexed.
        "400":
          description: A path segment is not a bare name, or not an apk file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to store, sign or index the package.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    Listing:
      type: object
      required: [version, repository, architecture, packages]
      properties:
        version:
          type: string
        repository:
          type: string
        architecture:
          type: string
        packages:
          type: array
          items:
            $ref: "#/components/schemas/Entry"
    Entry:
      type: object
      required: [name, version, architecture]
      properties:
        name:
          type: string
        version:
          type: string
        architecture:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ErrorResponse:
      type: object
      required: [error, event_identifier]
      properties:
        error:
          type: string
        event_identifier:
          type: string
