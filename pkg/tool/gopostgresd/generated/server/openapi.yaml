---
openapi: "3.0.0"
info:
  title: gopostgresd
  version: 1.0.0
paths:
  /api/instances:
    get:
      operationId: listInstances
      responses:
        "200":
          description: All configured instances.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Instance"
  /api/query:
    post:
      operationId: query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Query result rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"
        "400":
          description: Invalid instance or a statement the database refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The database refused the statement for lack of privilege.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Instance not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The statement conflicted with data or another transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The database instance is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to execute query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/explain:
    post:
      operationId: explain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExplainRequest"
      responses:
        "200":
          description: Explain plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"
        "400":
          description: Invalid instance or a statement the database refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The database refused the statement for lack of privilege.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Instance not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The statement conflicted with data or another transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The database instance is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to execute explain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/schemas:
    get:
      operationId: listSchemas
      parameters:
      - name: instance
        in: query
        required: false
        schema:
          type: string
        description: Instance name. Optional when only one instance is configured.
      responses:
        "200":
          description: Schemas in the database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"
        "400":
          description: Invalid instance or a statement the database refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The database refused the statement for lack of privilege.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Instance not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The statement conflicted with data or another transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The database instance is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to list schemas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/tables:
    get:
      operationId: listTables
      parameters:
      - name: instance
        in: query
        required: false
        schema:
          type: string
        description: Instance name. Optional when only one instance is configured.
      - name: schema
        in: query
        required: false
        schema:
          type: string
          default: public
        description: Schema name.
      responses:
        "200":
          description: Tables in the schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"
        "400":
          description: Invalid instance or a statement the database refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The database refused the statement for lack of privilege.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Instance not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The statement conflicted with data or another transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The database instance is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to list tables.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/tables/{table}:
    get:
      operationId: describeTable
      parameters:
      - name: table
        in: path
        required: true
        schema:
          type: string
        description: Table name.
      - name: instance
        in: query
        required: false
        schema:
          type: string
        description: Instance name. Optional when only one instance is configured.
      - name: schema
        in: query
        required: false
        schema:
          type: string
          default: public
        description: Schema name.
      responses:
        "200":
          description: Column definitions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"
        "400":
          description: Invalid instance or a statement the database refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The database refused the statement for lack of privilege.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Instance not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The statement conflicted with data or another transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The database instance is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to describe table.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/indexes:
    get:
      operationId: listIndexes
      parameters:
      - name: instance
        in: query
        required: false
        schema:
          type: string
        description: Instance name. Optional when only one instance is configured.
      - name: table
        in: query
        required: true
        schema:
          type: string
        description: Table name.
      - name: schema
        in: query
        required: false
        schema:
          type: string
          default: public
        description: Schema name.
      responses:
        "200":
          description: Indexes on the table.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"
        "400":
          description: Invalid instance or a statement the database refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The database refused the statement for lack of privilege.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Instance not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The statement conflicted with data or another transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The database instance is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to list indexes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/table-sizes:
    get:
      operationId: tableSizes
      parameters:
      - name: instance
        in: query
        required: false
        schema:
          type: string
        description: Instance name. Optional when only one instance is configured.
      - name: schema
        in: query
        required: false
        schema:
          type: string
          default: public
        description: Schema name.
      responses:
        "200":
          description: Table sizes and row counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"
        "400":
          description: Invalid instance or a statement the database refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The database refused the statement for lack of privilege.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Instance not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The statement conflicted with data or another transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The database instance is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to query table sizes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/backups:
    get:
      operationId: listBackups
      parameters:
      - name: instance
        in: query
        required: false
        schema:
          type: string
        description: Instance name. Optional when only one instance is configured.
      responses:
        "200":
          description: The instance's backups, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupList"
        "400":
          description: No instance selected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Instance not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to list backups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createBackup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupRequest"
      responses:
        "200":
          description: The backup written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backup"
        "400":
          description: No instance selected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Instance not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The dump failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/backups/{name}:
    delete:
      operationId: deleteBackup
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: Backup name, a UTC timestamp.
      - name: instance
        in: query
        required: false
        schema:
          type: string
        description: Instance name. Optional when only one instance is configured.
      responses:
        "204":
          description: The backup and its checksum removed.
        "400":
          description: No instance selected, or a name that is not a backup timestamp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Instance or backup not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to delete the backup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/backups/{name}/restore:
    post:
      operationId: restoreBackup
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: Backup name, a UTC timestamp.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreRequest"
      responses:
        "200":
          description: The database the backup was restored into.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreResult"
        "400":
          description: No instance selected, or a name that is not a backup timestamp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Instance or backup not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The target database exists, or other sessions are connected to the instance's own database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The database instance is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The restore failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    BackupRequest:
      type: object
      properties:
        instance:
          type: string
          description: Instance name. Optional when only one instance is configured.
    RestoreRequest:
      type: object
      properties:
        instance:
          type: string
          description: Instance name. Optional when only one instance is configured.
        target:
          type: string
          description: Database to restore into. Omitted, a new database beside the instance's; the instance's own database restores in place.
    Backup:
      type: object
      required:
      - instance
      - name
      - time
      - size
      properties:
        instance:
          type: string
        name:
          type: string
        time:
          type: string
          format: date-time
        size:
          type: integer
          format: int64
        checksum:
          type: string
          description: SHA-256 of the dump, on the backup just written.
        tables:
          type: integer
          description: Table data entries in the dump, on the backup just written.
    BackupList:
      type: object
      required:
      - backups
      properties:
        backups:
          type: array
          items:
            $ref: "#/components/schemas/Backup"
    RestoreResult:
      type: object
      required:
      - database
      properties:
        database:
          type: string
    Instance:
      type: object
      required:
      - name
      - host
      - port
      - database
      properties:
        name:
          type: string
        host:
          type: string
        port:
          type: integer
        database:
          type: string
    QueryRequest:
      type: object
      required:
      - sql
      properties:
        instance:
          type: string
          description: Instance name. Optional when only one instance is configured.
        sql:
          type: string
          description: SQL to execute.
    ExplainRequest:
      type: object
      required:
      - sql
      properties:
        instance:
          type: string
          description: Instance name. Optional when only one instance is configured.
        sql:
          type: string
          description: SQL to explain.
        analyze:
          type: boolean
          description: Run EXPLAIN ANALYZE.
          default: false
    QueryResult:
      type: object
      required:
      - columns
      - rows
      properties:
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            items: {}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ErrorResponse:
      type: object
      required: [error, event_identifier]
      properties:
        error:
          type: string
        event_identifier:
          type: string
