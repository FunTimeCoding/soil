---
openapi: "3.0.0"
info:
  title: gomemoryd
  version: 1.0.0
paths:
  /api/versions:
    get:
      operationId: getVersions
      parameters:
      - name: since
        in: query
        required: true
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        "200":
          description: Memory versions since timestamp.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VersionEntry"
        "500":
          description: Failed to query versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/profile:
    get:
      operationId: getProfile
      parameters:
      - name: topic
        in: query
        schema:
          type: string
      - name: detail
        in: query
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: Profile with tiered memories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "500":
          description: Failed to load profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/memory:
    post:
      operationId: postMemory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryRequest"
      responses:
        "200":
          description: Memory created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to create memory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/memory/{identifier}:
    put:
      operationId: putMemory
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryUpdateRequest"
      responses:
        "200":
          description: Memory updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryResponse"
        "500":
          description: Failed to update memory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMemory
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: source
        in: query
        schema:
          type: string
      responses:
        "200":
          description: Memory forgotten.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryResponse"
        "500":
          description: Failed to forget memory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/memories/sourced:
    get:
      operationId: getSourcedMemories
      parameters:
      - name: scope
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Document-sourced memories in the scope with provenance.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourcedMemory"
        "500":
          description: Failed to list sourced memories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/memories/redacted:
    get:
      operationId: getRedactedMemories
      responses:
        "200":
          description: Identifiers consumers must not display.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  format: int64
        "500":
          description: Failed to list redacted identifiers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/statistics:
    get:
      operationId: getStatistics
      responses:
        "200":
          description: Corpus counts by scope and tag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Statistics"
        "500":
          description: Failed to compute statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/relation:
    post:
      operationId: postRelation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_identifier, target_identifier]
              properties:
                source_identifier:
                  type: integer
                  format: int64
                target_identifier:
                  type: integer
                  format: int64
                type:
                  type: string
      responses:
        "200":
          description: Relation created or already present.
        "500":
          description: Failed to create relation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteRelation
      parameters:
      - name: source_identifier
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: target_identifier
        in: query
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Relation removed.
        "404":
          description: Relation not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to remove relation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/relations:
    get:
      operationId: getRelations
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: string
      - name: scope
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Relations with resolved names and scopes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Relation"
        "500":
          description: Failed to list relations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/impressions:
    post:
      operationId: postImpressions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                source:
                  type: string
      responses:
        "200":
          description: Impression created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpressionResponse"
        "500":
          description: Failed to create impression.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    MemoryRequest:
      type: object
      required: [name, content, description]
      properties:
        name:
          type: string
        content:
          type: string
        description:
          type: string
        type:
          type: string
        scope:
          type: string
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        source:
          type: string
        parent_identifier:
          type: integer
          format: int64
        provenance_file:
          type: string
        provenance_anchor:
          type: string
        provenance_hash:
          type: string
        ordinal:
          type: integer
    MemoryUpdateRequest:
      type: object
      required: [name, content, description]
      properties:
        name:
          type: string
        content:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        source:
          type: string
        provenance_hash:
          type: string
        ordinal:
          type: integer
    MemoryResponse:
      type: object
      required: [identifier]
      properties:
        identifier:
          type: integer
          format: int64
    SourcedMemory:
      type: object
      required: [identifier, name, provenance_file, provenance_anchor, provenance_hash, ordinal]
      properties:
        identifier:
          type: integer
          format: int64
        name:
          type: string
        parent_identifier:
          type: integer
          format: int64
        provenance_file:
          type: string
        provenance_anchor:
          type: string
        provenance_hash:
          type: string
        ordinal:
          type: integer
    ImpressionResponse:
      type: object
      required: [identifier]
      properties:
        identifier:
          type: integer
    VersionEntry:
      type: object
      required: [identifier, memory_identifier, name, description, changed_at, change_type, source]
      properties:
        identifier:
          type: integer
        memory_identifier:
          type: integer
        name:
          type: string
        description:
          type: string
        changed_at:
          type: string
        change_type:
          type: string
        source:
          type: string
    ProfileResponse:
      type: object
      required: [always, index]
      properties:
        always:
          type: array
          items:
            $ref: "#/components/schemas/ProfileMemory"
        relevant:
          type: array
          items:
            $ref: "#/components/schemas/ProfileSearchResult"
        index:
          type: array
          items:
            $ref: "#/components/schemas/ProfileSummary"
        impressions:
          type: array
          items:
            $ref: "#/components/schemas/ProfileImpression"
        completions:
          type: array
          items:
            $ref: "#/components/schemas/ProfileCompletion"
        detail:
          $ref: "#/components/schemas/ProfileDetail"
    ProfileDetail:
      type: object
      required: [budget, always_tokens, index_tokens, index_trimmed, completion_tokens, completions_trimmed, impression_tokens, impressions_trimmed, relevant_tokens, relevant_trimmed, total_tokens]
      properties:
        budget:
          type: integer
        always_tokens:
          type: integer
        index_tokens:
          type: integer
        index_trimmed:
          type: integer
        completion_tokens:
          type: integer
        completions_trimmed:
          type: integer
        impression_tokens:
          type: integer
        impressions_trimmed:
          type: integer
        relevant_tokens:
          type: integer
        relevant_trimmed:
          type: integer
        total_tokens:
          type: integer
    ProfileMemory:
      type: object
      required: [identifier, name, content, description, type, created_at, updated_at, is_active]
      properties:
        identifier:
          type: integer
        name:
          type: string
        content:
          type: string
        description:
          type: string
        type:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        is_active:
          type: boolean
        tags:
          type: array
          items:
            type: string
    ProfileSearchResult:
      type: object
      required: [identifier, name, content, description, type, updated_at, rank]
      properties:
        identifier:
          type: integer
        name:
          type: string
        content:
          type: string
        description:
          type: string
        type:
          type: string
        tags:
          type: array
          items:
            type: string
        updated_at:
          type: string
        rank:
          type: number
    ProfileSummary:
      type: object
      required: [identifier, name, description, type, updated_at]
      properties:
        identifier:
          type: integer
        name:
          type: string
        description:
          type: string
        type:
          type: string
        tags:
          type: array
          items:
            type: string
        updated_at:
          type: string
        children:
          type: array
          items:
            type: string
    ProfileImpression:
      type: object
      required: [identifier, content, source, created_at]
      properties:
        identifier:
          type: integer
        content:
          type: string
        source:
          type: string
        created_at:
          type: string
    ProfileCompletion:
      type: object
      required: [session_name, body]
      properties:
        session_name:
          type: string
        body:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Relation:
      type: object
      required: [source_identifier, source_name, target_identifier, target_name]
      properties:
        source_identifier:
          type: integer
          format: int64
        source_name:
          type: string
        source_scope:
          type: string
        target_identifier:
          type: integer
          format: int64
        target_name:
          type: string
        target_scope:
          type: string
        type:
          type: string
        created_at:
          type: string
    NamedCount:
      type: object
      required: [name, count]
      properties:
        name:
          type: string
        count:
          type: integer
        identifiers:
          type: array
          items:
            type: integer
            format: int64
    Statistics:
      type: object
      required: [scopes, tags]
      properties:
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/NamedCount"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/NamedCount"
    ErrorResponse:
      type: object
      required: [error, event_identifier]
      properties:
        error:
          type: string
        event_identifier:
          type: string
