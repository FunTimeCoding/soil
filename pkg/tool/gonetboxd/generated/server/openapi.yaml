---
openapi: "3.0.0"
info:
  title: gonetboxd
  version: 1.0.0
paths:
  /api/devices:
    get:
      operationId: listDevices
      parameters:
      - name: query
        in: query
        required: false
        schema:
          type: string
        description: Filter devices by name (case-insensitive contains). Omit for all.
      responses:
        "200":
          description: Devices.
          content:
            application/json:
              schema:
                type: array
                items:
                  nullable: true
                  allOf:
                  - $ref: "#/components/schemas/Device"
        "403":
          description: The NetBox token lacks permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to list devices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/devices/{name}:
    get:
      operationId: getDevice
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: Device name (exact match).
      responses:
        "200":
          description: Device detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "403":
          description: The NetBox token lacks permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Device not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to get device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateDevice
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: Device name (exact match).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeviceRequest"
      responses:
        "200":
          description: Updated device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          description: NetBox refused the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The NetBox token lacks permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The named object does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to update device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/devices/{name}/interfaces:
    get:
      operationId: listInterfaces
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
