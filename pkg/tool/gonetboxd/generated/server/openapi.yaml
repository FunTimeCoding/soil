          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteJournalEntry
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: Journal entry identifier.
      responses:
        "204":
          description: Journal entry deleted.
        "400":
          description: NetBox refused the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The NetBox token lacks permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: NetBox refused because dependent objects exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to delete journal entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/addresses/{identifier}:
    delete:
      operationId: deleteAddress
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: IP address identifier.
      responses:
        "204":
          description: Address deleted.
        "400":
          description: NetBox refused the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The NetBox token lacks permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: NetBox refused because dependent objects exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to delete address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    Device:
      type: object
      required:
      - identifier
      - name
      properties:
        identifier:
          type: integer
          format: int32
        name:
          type: string
        role:
          type: string
        type:
          type: string
        site:
          type: string
        tenant:
          type: string
        status:
          type: string
        serial:
          type: string
        primaryAddress:
          type: string
        tags:
          type: array
          items:
            type: string
        configuration:
          type: object
          additionalProperties: true
          description: Resolved configuration context, every matching context merged.
        customFields:
          type: object
          additionalProperties: true
          description: Custom field values by field name.
        link:
          type: string
        labels:
          type: array
          items:
            nullable: true
            allOf:
            - $ref: "#/components/schemas/Label"
    PhysicalAddressOwner:
      type: object
      required: [address]
      properties:
        address:
          type: string
        objectKind:
          type: string
        objectIdentifier:
          type: integer
          format: int32
        objectName:
          type: string
        interface:
          type: string
    PhysicalAddressRequest:
      type: object
      required: [address]
      properties:
        address:
          type: string
    PhysicalAddress:
      type: object
      required: [identifier, address]
      properties:
        identifier:
          type: integer
          format: int32
        address:
          type: string
        interface:
          type: string
    Interface:
      type: object
      required:
      - identifier
      - name
      properties:
        identifier:
          type: integer
          format: int32
        name:
          type: string
        description:
          type: string
        type:
          type: string
        physicalAddress:
          type: string
    Address:
      type: object
      required:
      - identifier
      - address
      properties:
        identifier:
          type: integer
          format: int32
        address:
          type: string
        name:
          type: string
        objectType:
          type: string
    Site:
      type: object
      required:
      - identifier
      - name
      properties:
        identifier:
          type: integer
          format: int32
        name:
          type: string
    Tenant:
      type: object
      required:
      - identifier
      - name
      properties:
        identifier:
          type: integer
          format: int32
        name:
          type: string
    DeviceRole:
      type: object
      required:
      - identifier
      - name
      - virtualMachine
      properties:
        identifier:
          type: integer
          format: int32
        name:
          type: string
        virtualMachine:
          type: boolean
          description: Whether virtual machines can take this role.
    CreateDeviceRoleRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        virtualMachine:
          type: boolean
          description: Allow virtual machines to take this role. Default false.
    Manufacturer:
      type: object
      required:
      - identifier
      - name
      properties:
        identifier:
          type: integer
          format: int32
        name:
          type: string
    DeviceType:
      type: object
      required:
      - identifier
      - model
      properties:
        identifier:
          type: integer
          format: int32
        model:
          type: string
        manufacturer:
          type: string
    CreateNameRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
    CreateDeviceTypeRequest:
      type: object
      required:
      - model
      - manufacturer
      properties:
        model:
          type: string
          description: Device type model name.
        manufacturer:
          type: string
          description: Manufacturer name (must already exist).
    CreateInterfaceRequest:
      type: object
      required:
      - name
      - type
      properties:
        name:
          type: string
          description: Interface name (e.g. eno1, eth0).
        type:
          type: string
          description: Interface type (e.g. 1000base-t, 10gbase-t).
        physicalAddress:
          type: string
          description: MAC address to create and assign to the interface.
    CreateAddressRequest:
      type: object
      required:
      - interface
      - address
      properties:
        interface:
          type: string
          description: Interface name on the device (e.g. eno1).
        address:
          type: string
          description: IP address in CIDR notation (e.g. 192.168.1.10/24).
        status:
          type: string
          description: Address status (active, dhcp, reserved). Defaults to active.
    CreateDeviceRequest:
      type: object
      required:
      - name
      - role
      - type
      - site
      properties:
        name:
          type: string
          description: Device name.
        role:
          type: string
          description: Device role name (must already exist).
        type:
          type: string
          description: Device type model name (must already exist).
        site:
          type: string
          description: Site name (must already exist).
        tenant:
          type: string
          description: Tenant name (must already exist). Optional.
        tags:
          type: array
          items:
            type: string
    Prefix:
      type: object
      required:
      - identifier
      - prefix
      properties:
        identifier:
          type: integer
          format: int32
        prefix:
          type: string
        description:
          type: string
        site:
          type: string
    CreatePrefixRequest:
      type: object
      required:
      - prefix
      properties:
        prefix:
          type: string
          description: CIDR notation (e.g. 192.168.178.0/24).
        site:
          type: string
          description: Site name (optional).
        description:
          type: string
          description: Description (optional).
    ClusterType:
      type: object
      required:
      - identifier
      - name
      properties:
        identifier:
          type: integer
          format: int32
        name:
          type: string
    Cluster:
      type: object
      required:
      - identifier
      - name
      properties:
        identifier:
          type: integer
          format: int32
        name:
          type: string
        type:
          type: string
        site:
          type: string
    VirtualMachine:
      type: object
      required:
      - identifier
      - name
      properties:
        identifier:
          type: integer
          format: int32
        name:
          type: string
        cluster:
          type: string
        site:
          type: string
        status:
          type: string
        role:
          type: string
        primaryAddress:
          type: string
        tags:
          type: array
          items:
            type: string
        configuration:
          type: object
          additionalProperties: true
          description: Resolved configuration context, every matching context merged.
        customFields:
          type: object
          additionalProperties: true
          description: Custom field values by field name.
        labels:
          type: array
          items:
            nullable: true
            allOf:
            - $ref: "#/components/schemas/Label"
    UpdateDeviceRequest:
      type: object
      properties:
        name:
          type: string
          description: New device name.
        primaryAddress:
          type: string
          description: Address to set as primary (must be assigned to the device).
        location:
          type: string
          description: Location name to assign (must already exist).
        platform:
          type: string
          description: Platform name to assign (must already exist).
        tenant:
          type: string
          description: Tenant name to assign (must already exist).
        status:
          type: string
          description: Status (active, offline, planned, staged, failed, inventory, decommissioning).
        serial:
          type: string
          description: Serial number.
        description:
          type: string
          description: Device description.
        customFields:
          type: object
          additionalProperties: true
          description: Custom field values to set, by field name; fields not named keep their value.
    UpdateVirtualMachineRequest:
      type: object
      properties:
        name:
          type: string
          description: New virtual machine name.
        primaryAddress:
          type: string
          description: Address to set as primary (must be assigned to the virtual machine).
        platform:
          type: string
          description: Platform name to assign (must already exist).
        role:
          type: string
          description: Role name to assign (must already exist and allow virtual machines).
        tenant:
          type: string
          description: Tenant name to assign (must already exist).
        cores:
          type: number
          description: Virtual CPU count.
        memory:
          type: integer
          description: Memory in megabytes.
        status:
          type: string
          description: Status (active, offline, planned, staged, failed, decommissioning).
        customFields:
          type: object
          additionalProperties: true
          description: Custom field values to set, by field name; fields not named keep their value.
    AddressRange:
      type: object
      required:
      - identifier
      - start
      - end
      properties:
        identifier:
          type: integer
          format: int32
        start:
          type: string
        end:
          type: string
        status:
          type: string
    CreateAddressRangeRequest:
      type: object
      required:
      - start
      - end
      properties:
        start:
          type: string
          description: Start address in CIDR notation (e.g. 192.168.1.50/24).
        end:
          type: string
          description: End address in CIDR notation (e.g. 192.168.1.254/24).
        status:
          type: string
          description: Range status (active, reserved, deprecated). Defaults to active.
        description:
          type: string
          description: Range description.
    Location:
      type: object
      required:
      - identifier
      - name
      properties:
        identifier:
          type: integer
          format: int32
        name:
          type: string
    CreateLocationRequest:
      type: object
      required:
      - name
      - site
      properties:
        name:
          type: string
          description: Location name.
        site:
          type: string
          description: Site name (must already exist).
    Platform:
      type: object
      required:
      - identifier
      - name
      properties:
        identifier:
          type: integer
          format: int32
        name:
          type: string
    WirelessNetwork:
      type: object
      required:
      - identifier
      - name
      properties:
        identifier:
          type: integer
          format: int32
        name:
          type: string
    VirtualDisk:
      type: object
      required:
      - identifier
      - name
      - size
      properties:
        identifier:
          type: integer
          format: int32
        name:
          type: string
        size:
          type: integer
          format: int32
    CreateVirtualDiskRequest:
      type: object
      required:
      - name
      - size
      properties:
        name:
          type: string
          description: Disk name.
        size:
          type: integer
          format: int32
          description: Disk size in megabytes.
    CreateClusterRequest:
      type: object
      required:
      - name
      - type
      - site
      properties:
        name:
          type: string
          description: Cluster name.
        type:
          type: string
          description: Cluster type name (must already exist).
        site:
          type: string
          description: Site name (must already exist).
    CreateVirtualMachineRequest:
      type: object
      required:
      - name
      - cluster
      properties:
        name:
          type: string
          description: Virtual machine name.
        cluster:
          type: string
          description: Cluster name (must already exist).
    VirtualInterface:
      type: object
      required:
      - identifier
      - name
      properties:
        identifier:
          type: integer
          format: int32
        name:
          type: string
    CreateVirtualInterfaceRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Interface name (e.g. ens3, eth0).
    Label:
      type: object
      required:
      - key
      - value
      properties:
        key:
          type: string
        value:
          type: string
    SetLabelRequest:
      type: object
      required:
      - value
      properties:
        value:
          type: string
    JournalEntry:
      type: object
      required:
      - identifier
      - comments
      properties:
        identifier:
          type: integer
          format: int32
        kind:
          type: string
        comments:
          type: string
        created:
          type: string
    CreateJournalEntryRequest:
      type: object
      required:
      - comments
      properties:
        comments:
          type: string
        kind:
          type: string
    UpdateJournalEntryRequest:
      type: object
      properties:
        comments:
          type: string
        kind:
          type: string
    Tag:
      type: object
      required:
      - identifier
      - name
      properties:
        identifier:
          type: integer
          format: int32
        name:
          type: string
    TunnelGroup:
      type: object
      required:
      - identifier
      - name
      properties:
        identifier:
          type: integer
          format: int32
        name:
          type: string
    Cable:
      type: object
      required:
      - identifier
      - name
      properties:
        identifier:
          type: integer
          format: int32
        name:
          type: string
        status:
          type: string
        sideA:
          type: string
        sideB:
          type: string
        link:
          type: string
    CreateCableRequest:
      type: object
      required:
      - deviceA
      - interfaceA
      - deviceB
      - interfaceB
      properties:
        deviceA:
          type: string
          description: Device name on side A.
        interfaceA:
          type: string
          description: Interface name on side A.
        deviceB:
          type: string
          description: Device name on side B.
        interfaceB:
          type: string
          description: Interface name on side B.
    Tunnel:
      type: object
      required:
      - identifier
      - name
      properties:
        identifier:
          type: integer
          format: int32
        name:
          type: string
        encapsulation:
          type: string
        group:
          type: string
    TunnelTermination:
      type: object
      required:
      - identifier
      properties:
        identifier:
          type: integer
          format: int32
        tunnel:
          type: string
        role:
          type: string
        terminationType:
          type: string
        terminationIdentifier:
          type: integer
          format: int64
    CreateTunnelRequest:
      type: object
      required:
      - name
      - encapsulation
      - group
      properties:
        name:
          type: string
          description: Tunnel name.
        encapsulation:
          type: string
          description: Encapsulation type (e.g. wireguard, gre, openvpn).
        group:
          type: string
          description: Tunnel group name (must already exist).
    CreateTunnelTerminationRequest:
      type: object
      required:
      - tunnel
      - interface
      - role
      properties:
        tunnel:
          type: string
          description: Tunnel name (must already exist).
        interface:
          type: string
          description: Interface name on the device or VM.
        role:
          type: string
          description: Termination role (peer, hub, spoke).
    ConfigurationContext:
      type: object
      required:
      - identifier
      - name
      - weight
      - active
      - payload
      - assignment
      properties:
        identifier:
          type: integer
          format: int32
        name:
          type: string
        weight:
          type: integer
          format: int32
        description:
          type: string
        active:
          type: boolean
        payload:
          type: object
          additionalProperties: true
          description: The JSON this context contributes to every object it applies to, netbox's data block.
        assignment:
          $ref: "#/components/schemas/ConfigurationAssignment"
    ChoiceSet:
      type: object
      required:
      - identifier
      - name
      - choices
      properties:
        identifier:
          type: integer
          format: int32
        name:
          type: string
        choices:
          type: array
          items:
            type: string
    CreateChoiceSetRequest:
      type: object
      required:
      - name
      - choices
      properties:
        name:
          type: string
        choices:
          type: array
          items:
            type: string
    UpdateChoiceSetRequest:
      type: object
      required:
      - choices
      properties:
        choices:
          type: array
          items:
            type: string
          description: Replaces every choice.
    CustomField:
      type: object
      required:
      - identifier
      - name
      - kind
      - objectTypes
      properties:
        identifier:
          type: integer
          format: int32
        name:
          type: string
        label:
          type: string
        kind:
          type: string
        objectTypes:
          type: array
          items:
            type: string
        choiceSet:
          type: string
    CreateCustomFieldRequest:
      type: object
      required:
      - name
      - choiceSet
      properties:
        name:
          type: string
        label:
          type: string
        choiceSet:
          type: string
          description: Choice set the field selects from (must already exist).
    ConfigurationAssignment:
      type: object
      description: Objects this context applies to, by name. Empty everywhere applies it to everything.
      properties:
        roles:
          type: array
          items:
            type: string
        clusters:
          type: array
          items:
            type: string
        platforms:
          type: array
          items:
            type: string
        sites:
          type: array
          items:
            type: string
        tenants:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
    CreateConfigurationContextRequest:
      type: object
      required:
      - name
      - payload
      properties:
        name:
          type: string
        weight:
          type: integer
          format: int32
          description: Merge order; higher weights win. Default 1000.
        payload:
          type: object
          additionalProperties: true
        assignment:
          $ref: "#/components/schemas/ConfigurationAssignment"
    UpdateConfigurationContextRequest:
      type: object
      properties:
        weight:
          type: integer
          format: int32
        payload:
          type: object
          additionalProperties: true
          description: Replaces the whole payload.
        assignment:
          $ref: "#/components/schemas/ConfigurationAssignment"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ErrorResponse:
      type: object
      required: [error, event_identifier]
      properties:
        error:
          type: string
        event_identifier:
          type: string
